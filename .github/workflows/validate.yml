name: Validate task system

on:
  push:
    branches:
      - main
      - "task/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate task system
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .tasks/requirements.txt

      - name: Install validation dependencies
        run: python -m pip install -r .tasks/requirements.txt

      - name: Run task-system regression tests
        run: python -m unittest discover -s .tasks/tests -p "test_*.py" -v

      - name: Validate distributable template and live project instance
        run: python .tasks/scripts/validate.py --template-root .tasks --instance-root .project-tasks
