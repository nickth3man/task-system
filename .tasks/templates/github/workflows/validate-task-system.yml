name: Validate task system

# Runs on every pull request so the check always reports a conclusion, but
# skips push runs when no task files changed.
on:
  push:
    paths:
      - ".tasks/**"
      - ".project-tasks/**"
      - ".github/workflows/validate-task-system.yml"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .tasks/requirements.txt
      - run: python3 -m pip install -r .tasks/requirements.txt
      - run: python3 .tasks/scripts/validate.py --instance-only --template-root .tasks --instance-root .project-tasks
