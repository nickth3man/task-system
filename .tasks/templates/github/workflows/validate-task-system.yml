name: Validate task system

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .tasks/requirements.txt
      - run: python -m pip install -r .tasks/requirements.txt
      - run: python -m unittest discover -s .tasks/tests -p "test_*.py" -v
      - run: python .tasks/scripts/validate.py --instance-only --instance-root .tasks
