schema_version: "4.0.0"
task_system_version: "4.0.0"
mode: "template"
timezone: "__REQUIRED_TIMEZONE__"

repository:
  name: "__REQUIRED_REPOSITORY_NAME__"
  default_branch: "__REQUIRED_DEFAULT_BRANCH__"
  remote: "origin"
  provider: "github"

# `bundle` is the replaceable product directory. Every other path is live state
# and must stay outside it so the bundle can be upgraded by replacement.
paths:
  bundle: ".tasks"
  instructions: "AGENTS.md"
  active: ".project-tasks/active"
  archive: ".project-tasks/archive"
  template: ".tasks/templates/task"
  index: ".project-tasks/index.yaml"

identifiers:
  prefix: "TASK"
  scope: "repository"
  sequence_width: 3
  allocation: "scan_active_archive_and_remote_branches"
  collision_policy: "retry_next_sequence"
  format: "{prefix}-{year}-{sequence}"

# Task types listed in `lite_profile_task_types` require a reduced artifact set:
# task.yaml, task.md, findings.md, plan.md, verification.md, completion.md.
# Assessment and research are folded into findings.md. Every approval, gate, and
# traceability rule still applies. Leave the list empty to require the full
# profile for every task type.
lifecycle:
  full_profile_required: true
  lite_profile_task_types: ["documentation", "dependency"]
  allow_not_applicable_with_reason: true
  one_agent_owns_lifecycle: true
  required_approvals: ["findings", "plan", "pull_request", "merge"]
  approval_source: "chat"
  material_changes_invalidate_approval: true

research:
  stage_required: true
  allow_no_external_sources_with_rationale: true

commands:
  status: "git status --porcelain"
  untracked: "git status --short"
  diff_base: "git diff --stat {base_commit}..HEAD"
  diff_full: "git diff {base_commit}..HEAD"
  diff_worktree: "git diff"
  diff_staged: "git diff --cached"
  format: null
  lint: null
  typecheck: null
  unit_test: null
  integration_test: null
  end_to_end_test: null
  build: null
  validate_bundle: "python3 .tasks/scripts/validate.py --template-only --template-root .tasks"
  validate_task_system: "python3 .tasks/scripts/validate.py --instance-only --template-root .tasks --instance-root .project-tasks"
  generate_index: "python3 .tasks/scripts/generate_index.py --instance-root .project-tasks"

concurrency:
  multiple_active_tasks_allowed: true
  max_pre_branch_tasks_per_worktree: 1
  separate_branch_or_worktree_required_for_implementation: true

artifacts:
  require_all_template_files_while_active: true
  implementation_log_append_only_while_active: true
  screenshots_directory: "evidence/screenshots"
  commit_only_relevant_screenshots: true
  condense_log_before_archive: true
  remove_temporary_evidence_before_archive: true

acceptance_criteria:
  require_stable_ids: true
  id_prefix: "AC"
  require_explicit_verification: true
  allow_failed_at_merge: false
  allow_unverified_at_merge: false

plan:
  require_stable_ids: true
  id_prefix: "PLAN"
  require_files_or_symbols: true
  require_validation: true
  require_risks: true
  require_rollback_or_migration_when_applicable: true

git:
  branch_pattern: "task/{id}-{slug}"
  require_no_unrelated_changes_before_branch: true
  allow_current_task_artifacts_before_branch: true
  on_unrelated_uncommitted_changes: "stop_and_ask"
  allow_automatic_stash: false
  commit_policy: "logical_incremental"
  commit_subject_pattern: "{id}: {summary}"
  push_before_pr_approval: true

# Set `enabled: false`, or repository.provider to "other", when the repository
# has no GitHub pull-request checks. Merge approval then binds to the reviewed
# candidate head alone instead of to a green check run.
github:
  enabled: true
  ci_poll_interval_seconds: 30
  ci_timeout_minutes: 90
  wait_for_review_comments: false
  required_checks_mode: "discover"
  required_checks: []
  on_no_checks_discovered: "stop_and_ask"
  merge_strategy: "repository_policy"
  on_ambiguous_repository_policy: "use_fallback"
  fallback_merge_strategy: "squash"
  archival_pr_required: true
  archival_pr_requires_additional_user_approval: false

archive:
  path_pattern: ".project-tasks/archive/{year}/{month}/{id}-{slug}"
  preserve:
    - "task.yaml"
    - "task.md"
    - "assessment.md"
    - "research.md"
    - "links.md"
    - "findings.md"
    - "plan.md"
    - "verification.md"
    - "review.md"
    - "completion.md"
  condense_or_remove:
    - "implementation-log.md"
    - "raw_command_output"
    - "downloaded_research_material"
    - "temporary_screenshots"
    - "duplicate_notes"

overrides: {}
